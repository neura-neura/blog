name: Publish blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/blog-public
          ssh-key: ${{ secrets.PUBLIC_CONTENT_SSH_KEY }}
          persist-credentials: false
          path: .content-sources/public
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/blog-unlisted
          ssh-key: ${{ secrets.UNLISTED_CONTENT_SSH_KEY }}
          persist-credentials: false
          path: .content-sources/unlisted
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_POSTS_DIR: .content-sources/public/posts
          UNLISTED_POSTS_DIR: .content-sources/unlisted/posts
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
